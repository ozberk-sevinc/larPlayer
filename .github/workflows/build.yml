name: Build Windows player

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
      - name: Check checkout and hostile ZIP handling
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'Build must start from a clean checkout.' }
          ./scripts/security.ps1
      - name: Build portable player
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check the release
        shell: pwsh
        run: ./scripts/smoke.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LARPlayer-Windows-x64
          path: dist/LARPlayer-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: LARPlayer-Windows-x64-SHA256
          path: dist/LARPlayer-Windows-x64.zip.sha256
          if-no-files-found: error
